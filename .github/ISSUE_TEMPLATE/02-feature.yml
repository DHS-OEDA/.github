name: ✨ Feature request
description: Suggest a new capability or an improvement to something that exists.
title: "[Feature]: "
type: Feature
labels: ["triage"]
body:
  - type: markdown
    attributes:
      value: |
        Lead with the **problem**, not the solution. A clear problem lets the team find the best fix.
        **Never paste confidential data** (client records, PII/PHI, credentials).

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Who is affected, and what is hard or slow right now?
      placeholder: "Every quarter I re-run the same five queries by hand to build the caseload summary..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Rough ideas are fine.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've tried or thought about.
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: How will we know it's done?
      description: A short checklist of acceptance criteria.
      value: |
        - [ ]
        - [ ]
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority (your view)
      options:
        - "High: needed for a near-term deliverable"
        - "Medium: would meaningfully help"
        - "Low: nice to have"
      default: 1
    validations:
      required: true

  - type: input
    id: deadline
    attributes:
      label: Needed by (if any)
      placeholder: "2026-12-15, or 'before Q1 report'"
    validations:
      required: false

  - type: input
    id: epic
    attributes:
      label: Related epic
      description: Link the parent epic if this is part of a larger effort.
      placeholder: "#42"
    validations:
      required: false

  - type: checkboxes
    id: data-safety
    attributes:
      label: Data safety check
      options:
        - label: This issue contains no confidential data, PII/PHI, or credentials.
          required: true
