name: 🐞 Bug report
description: Something is broken, erroring, or producing wrong output.
title: "[Bug]: "
type: Bug
labels: ["triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Short and specific beats long and vague.
        **Never paste confidential data** (client records, PII/PHI, credentials, row-level output). Use counts, column names, or made-up examples instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem. What did you see?
      placeholder: "Running `targets::tar_make()` fails at the `clean_claims` step with..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that shows the problem.
      placeholder: |
        1. Check out branch `...`
        2. Run `...`
        3. See error
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Where does this happen?
      multiple: true
      options:
        - Posit Workbench
        - Posit Connect (published content)
        - Local machine
        - Snowflake (query / stored procedure)
        - SQL Server
        - GitHub Actions / CI
        - Other / not sure
    validations:
      required: true

  - type: dropdown
    id: language
    attributes:
      label: Language / tool
      multiple: true
      options:
        - R
        - Python
        - SQL
        - Quarto
        - Shell / config
        - Other
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Branch, commit, or version
      placeholder: "main @ a1b2c3d, or v1.4.0"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Error message or log output
      description: Paste the error. It'll be formatted as code automatically. Scrub anything confidential first.
      render: shell
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: How bad is it?
      options:
        - "Blocking: can't work / deliverable at risk"
        - "Major: wrong results or broken feature, workaround exists"
        - "Minor: annoying or cosmetic"
      default: 1
    validations:
      required: true

  - type: checkboxes
    id: data-safety
    attributes:
      label: Data safety check
      options:
        - label: This issue contains no confidential data, PII/PHI, or credentials.
          required: true
